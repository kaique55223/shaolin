<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        * {
            box-sizing: border-box;
        }

    

        .card-botton {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: inline-block;
            background-color: green;
            color: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid green;
        }
    </style>
</head>

<body>

    <section class="card">
        <h1> luvas</h1>
        <p>16oz tecido firme e confortavel </p>
        <button class="card-botton">Comprar</button>
    </section>
</body>
h1 { font-size: clamp(2rem, 5px)}
</html>
